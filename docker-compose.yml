services:
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - backend/.env
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  backend:
    build: ./backend
    env_file:
      - backend/.env
    volumes:
     - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    expose:
      - "8000"

  frontend:
    build: ./frontend
    env_file:
      - frontend/.env
    volumes:
     - ./frontend:/app
     - /app/node_modules
    networks:
      - app_network
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - app_network
    restart: unless-stopped


networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: